<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Route not found | Abdulrahman Alkhaldi</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'self'">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23060a12'/><rect x='14' y='14' width='72' height='72' rx='14' fill='none' stroke='%2313273a' stroke-width='2'/><text x='50' y='66' font-family='monospace' font-size='40' font-weight='bold' fill='%233ecfff' text-anchor='middle'>~$</text><rect x='62' y='44' width='6' height='30' fill='%233ecfff'><animate attributeName='opacity' values='1;0;1' dur='1.1s' repeatCount='indefinite'/></rect></svg>">
<style>
  :root{--bg:#060a12;--surface:#0d1524;--border:rgba(126,190,255,.14);--ink:#e8eefb;--muted:#8a9cbb;--faint:#5d6f8f;--accent:#3ecfff}
  @media (prefers-color-scheme: light){
    :root{--bg:#f4f7fb;--surface:#ffffff;--border:#d5dbe4;--ink:#0f172a;--muted:#475569;--faint:#64748b;--accent:#0284c7}
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:ui-monospace,"Cascadia Mono",Consolas,"JetBrains Mono",Menlo,monospace;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    width:100%;max-width:640px;border:1px solid var(--border);border-radius:16px;
    background:var(--surface);padding:40px 36px;box-shadow:0 24px 60px -30px rgba(62,207,255,.18);
  }
  .code{font-size:clamp(64px,14vw,110px);font-weight:700;line-height:1;letter-spacing:.02em;
    background:linear-gradient(100deg,var(--ink),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
  .tag{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  .term{border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:18px 20px;font-size:13.5px;line-height:1.9;margin-bottom:26px}
  .prompt{color:var(--faint)}
  .prompt b{color:var(--accent);font-weight:600}
  .cmd{color:var(--ink)}
  .err{color:#f87171}
  .cursor{display:inline-block;width:8px;height:15px;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1.1s steps(1) infinite;border-radius:1px}
  @keyframes blink{50%{opacity:0}}
  .btn{display:inline-flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;border:1px solid var(--accent);
    background:var(--accent);color:#06121d;font-size:13px;font-weight:600;letter-spacing:.06em;padding:12px 22px;border-radius:10px;transition:opacity .2s}
  .btn:hover{opacity:.85}
  .foot{margin-top:26px;font-size:11.5px;color:var(--faint);letter-spacing:.04em}
</style>
</head>
<body>
  <div class="card">
    <div class="tag">Error 404</div>
    <div class="code">404</div>
    <div class="term">
      <div><span class="prompt">abdulrahman@alkhaldi:<b>~</b>$ </span><span class="cmd">cd /route/not-found</span></div>
      <div><span class="err">bash: cd: /route/not-found: No such file or directory</span><span class="cursor"></span></div>
    </div>
    <a class="btn" href="/">← cd ~ &nbsp;return to alkhaldi.dev</a>
    <div class="foot">The page you're looking for doesn't exist, moved, or was never routed.</div>
  </div>
</body>
</html>
